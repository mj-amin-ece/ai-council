<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Council</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
    --accent: #2f5bd3; --accent-ink: #fff; --err: #b3261e;
    --claude: #c96442; --chatgpt: #10a37f; --gemini: #4f7cf0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #201f1d; --ink: #ecebe7; --muted: #9c9a94; --line: #34332f;
      --accent: #6d8ff0; --accent-ink: #0d0d0c; --err: #f2867e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .models { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .model { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
           border-top: 4px solid var(--c); }
  .model label { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
  .model select, .model input[type=text] { width: 100%; margin-top: 8px; }
  .model .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .model .hint code { font-size: 11px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-left: auto; }
  .dot.ok { background: #2e9e5b; } .dot.no { background: var(--err); }
  input[type=text], textarea, select {
    font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; }
  textarea { width: 100%; min-height: 96px; resize: vertical; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 24px; }
  button { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .round h2 { font-size: 16px; margin: 28px 0 10px; display: flex; gap: 10px; align-items: baseline; }
  .round h2 small { color: var(--muted); font-weight: 400; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
          border-top: 4px solid var(--c); min-width: 0; }
  .card header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .card header b { font-size: 15px; }
  .card header span { color: var(--muted); font-size: 12px; }
  .card .body { overflow-wrap: anywhere; }
  .card .body pre { overflow-x: auto; background: var(--bg); padding: 10px; border-radius: 6px; }
  .card .body :is(h1,h2,h3) { font-size: 15px; }
  .card .err { color: var(--err); white-space: pre-wrap; font-size: 13px; }
  details.review { background: var(--bg); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
  details.review summary { cursor: pointer; font-weight: 600; color: var(--muted); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line);
             border-top-color: var(--c); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .final { border-top-width: 4px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  footer { margin-top: 60px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted);
           font-size: 13px; text-align: center; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>AI Council</h1>
  <p class="sub">Ask Claude, ChatGPT and Gemini the same question. Then let them review each other's answers and improve, round after round.</p>

  <section class="models" id="models"></section>

  <textarea id="question" placeholder="Ask your question…  (Cmd+Enter to send)"></textarea>
  <div class="bar">
    <button class="primary" id="askBtn">Ask selected models</button>
    <button id="reviewBtn" disabled>Review &amp; improve (next round)</button>
    <span style="flex:1"></span>
    <label>Final answer by
      <select id="judge"></select>
    </label>
    <button id="finalBtn" disabled>Write final answer</button>
    <button id="resetBtn">New question</button>
  </div>

  <section id="rounds"><p class="empty">Answers will appear here.</p></section>

  <footer>
    Developed by <b>Mohammad Javad Amin</b><br>
    If you have any questions, contact me: <a href="mailto:aminm@usi.ch">aminm@usi.ch</a>
  </footer>
</main>

<script>
const PROVIDERS = [
  { key: "claude",  label: "Claude",  color: "var(--claude)" },
  { key: "chatgpt", label: "ChatGPT", color: "var(--chatgpt)" },
  { key: "gemini",  label: "Gemini",  color: "var(--gemini)" },
];
const byKey = Object.fromEntries(PROVIDERS.map(p => [p.key, p]));
const $ = id => document.getElementById(id);

let question = "";
let rounds = [];   // [{ title, note, results: { key: { status, text, review, answer, error, seconds } } }]
let finalResult = null;
let busy = false;

// ---------- settings (remembered in this browser) ----------
const saved = (() => { try { return JSON.parse(localStorage.getItem("ai-council") || "{}"); } catch { return {}; } })();
function saveSettings() {
  const s = {};
  for (const p of PROVIDERS) s[p.key] = { on: $("on-" + p.key).checked, model: getModel(p.key) };
  s.judge = $("judge").value;
  try { localStorage.setItem("ai-council", JSON.stringify(s)); } catch {}
}

function buildModelPickers() {
  $("models").innerHTML = PROVIDERS.map(p => `
    <div class="model" style="--c:${p.color}">
      <label><input type="checkbox" id="on-${p.key}" ${saved[p.key]?.on === false ? "" : "checked"}> ${p.label}
        <span class="dot" id="dot-${p.key}" title="checking…"></span></label>
      <select id="model-${p.key}" aria-label="${p.label} model"><option value="">Default</option></select>
      <input type="text" id="custom-${p.key}" placeholder="Type a model name" hidden>
      <div class="hint" id="hint-${p.key}"></div>
    </div>`).join("");
  for (const p of PROVIDERS) {
    $("model-" + p.key).addEventListener("change", () => {
      $("custom-" + p.key).hidden = $("model-" + p.key).value !== OTHER;
      if (!$("custom-" + p.key).hidden) $("custom-" + p.key).focus();
    });
  }
  $("judge").innerHTML = PROVIDERS.map(p => `<option value="${p.key}">${p.label}</option>`).join("");
  if (saved.judge) $("judge").value = saved.judge;
  document.querySelectorAll("#models input, #models select, #judge").forEach(el => el.addEventListener("change", saveSettings));
}

// ---------- model dropdowns (lists come from server.py) ----------
const OTHER = "__other__";

function getModel(key) {
  const v = $("model-" + key).value;
  return v === OTHER ? $("custom-" + key).value.trim() : v;
}

function fillModels(key, models) {
  const sel = $("model-" + key), want = saved[key]?.model || "";
  sel.innerHTML = models.map(([id, name]) => `<option value="${escapeHtml(id)}">${escapeHtml(name)}</option>`).join("") +
    `<option value="${OTHER}">Other… (type a name)</option>`;
  if (models.some(([id]) => id === want)) sel.value = want;
  else { sel.value = OTHER; $("custom-" + key).value = want; }
  $("custom-" + key).hidden = sel.value !== OTHER;
}

async function checkStatus() {
  try {
    const s = await (await fetch("/api/status")).json();
    for (const p of PROVIDERS) {
      const st = s[p.key], dot = $("dot-" + p.key);
      fillModels(p.key, st.models || []);
      dot.className = "dot " + (st.installed ? "ok" : "no");
      dot.title = st.installed ? "CLI found" : "Not installed";
      if (!st.installed) {
        $("hint-" + p.key).innerHTML = `Not installed. In Terminal run:<br><code>${escapeHtml(st.install)}</code>`;
        $("on-" + p.key).checked = false;
      }
    }
  } catch { /* server offline: leave dots grey */ }
}

// ---------- prompts ----------
function firstPrompt(q) { return q; }

function reviewPrompt(me, q, prev) {
  const others = Object.keys(prev).filter(k => k !== me);
  let s = `You are ${byKey[me].label}, one of several AI assistants (${Object.keys(prev).map(k => byKey[k].label).join(", ")}) ` +
    `answering the same question together. Your job this round is to review the other answers critically and then improve your own.\n\n` +
    `=== QUESTION ===\n${q}\n\n=== YOUR PREVIOUS ANSWER ===\n${prev[me]}\n\n`;
  for (const k of others) s += `=== ANSWER FROM ${byKey[k].label.toUpperCase()} ===\n${prev[k]}\n\n`;
  s += `=== YOUR TASK ===\n` +
    `1. Review: for each other answer, briefly point out factual errors, weak reasoning, missing points, and anything it does better than yours. Be honest. If they are right and you were wrong, say so.\n` +
    `2. Improved answer: write your best, complete, standalone answer to the question. Keep what was right, fix what was wrong, and adopt the strongest ideas from the others.\n\n` +
    `Use exactly these two headings:\n## Review\n...\n## Improved answer\n...`;
  return s;
}

function finalPrompt(q, prev, n) {
  let s = `Several AI assistants answered the question below, then reviewed and improved each other's answers over ${n} round(s).\n\n` +
    `=== QUESTION ===\n${q}\n\n`;
  for (const k of Object.keys(prev)) s += `=== LATEST ANSWER FROM ${byKey[k].label.toUpperCase()} ===\n${prev[k]}\n\n`;
  s += `=== YOUR TASK ===\nWrite the single best final answer to the question, combining the strongest, correct points from all answers. ` +
    `Then add a short section "## Where they disagreed" listing any remaining disagreements and which view you think is right and why.`;
  return s;
}

function splitReview(text) {
  const m = text.match(/^#{1,4}\s*\**\s*Improved answer\s*\**\s*:?\s*$/im);
  if (!m) return { review: "", answer: text };
  const review = text.slice(0, m.index).replace(/^#{1,4}\s*\**\s*Review\s*\**\s*:?\s*$/im, "").trim();
  return { review, answer: text.slice(m.index + m[0].length).trim() };
}

// ---------- running ----------
async function ask(key, prompt) {
  const res = await fetch("/api/ask", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ provider: key, prompt, model: getModel(key) }),
  });
  return res.json();
}

function latestAnswers() {
  const last = rounds[rounds.length - 1];
  const out = {};
  if (!last) return out;
  for (const [k, r] of Object.entries(last.results)) if (r.status === "done") out[k] = r.answer;
  return out;
}

async function runRound(title, note, keys, makePrompt, isReview) {
  const round = { title, note, results: {} };
  for (const k of keys) round.results[k] = { status: "running" };
  rounds.push(round);
  render();
  await Promise.all(keys.map(async k => {
    const t0 = Date.now();
    const r = round.results[k];
    try {
      const data = await ask(k, makePrompt(k));
      if (data.error) Object.assign(r, { status: "error", error: data.error });
      else {
        const parts = isReview ? splitReview(data.text) : { review: "", answer: data.text };
        Object.assign(r, { status: "done", text: data.text, ...parts, seconds: data.seconds });
      }
    } catch (e) {
      Object.assign(r, { status: "error", error: "Could not reach the server. Is server.py running?\n" + e });
    }
    r.seconds ??= ((Date.now() - t0) / 1000).toFixed(1);
    render();
  }));
}

function selectedKeys() { return PROVIDERS.map(p => p.key).filter(k => $("on-" + k).checked); }

async function guard(fn) {
  if (busy) return;
  busy = true; updateButtons();
  try { await fn(); } finally { busy = false; updateButtons(); }
}

$("askBtn").onclick = () => guard(async () => {
  const q = $("question").value.trim();
  const keys = selectedKeys();
  if (!q) return $("question").focus();
  if (!keys.length) return alert("Select at least one model.");
  question = q; rounds = []; finalResult = null;
  await runRound("Round 1", "First answers", keys, () => firstPrompt(q), false);
});

$("reviewBtn").onclick = () => guard(async () => {
  const prev = latestAnswers();
  const keys = Object.keys(prev).filter(k => $("on-" + k).checked);
  if (keys.length < 2) return alert("Need at least two models with answers to review each other.");
  const ctx = Object.fromEntries(keys.map(k => [k, prev[k]]));
  finalResult = null;
  await runRound(`Round ${rounds.length + 1}`, "Each model reviews the others and improves its answer",
    keys, k => reviewPrompt(k, question, ctx), true);
});

$("finalBtn").onclick = () => guard(async () => {
  const prev = latestAnswers();
  const judge = $("judge").value;
  finalResult = { key: judge, status: "running" };
  render();
  try {
    const data = await ask(judge, finalPrompt(question, prev, rounds.length));
    finalResult = data.error ? { key: judge, status: "error", error: data.error }
                             : { key: judge, status: "done", answer: data.text, seconds: data.seconds };
  } catch (e) { finalResult = { key: judge, status: "error", error: String(e) }; }
  render();
});

$("resetBtn").onclick = () => {
  if (busy) return;
  question = ""; rounds = []; finalResult = null;
  $("question").value = ""; $("question").focus();
  render();
};

$("question").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("askBtn").click();
});

function updateButtons() {
  const n = Object.keys(latestAnswers()).length;
  $("askBtn").disabled = busy;
  $("reviewBtn").disabled = busy || n < 2;
  $("finalBtn").disabled = busy || n < 1;
  $("resetBtn").disabled = busy;
}

// ---------- rendering ----------
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function md(text) {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text));
  return `<div style="white-space:pre-wrap">${escapeHtml(text)}</div>`;
}

function cardHtml(key, r, isReview) {
  const p = byKey[key];
  let meta = r.status === "running" ? `<span class="spinner"></span> thinking…`
           : r.status === "done" ? `${r.seconds}s` : "failed";
  let body = "";
  if (r.status === "error") body = `<div class="err">${escapeHtml(r.error)}</div>`;
  if (r.status === "done") {
    if (isReview && r.review)
      body += `<details class="review"><summary>Review of the others</summary>${md(r.review)}</details>`;
    body += md(r.answer);
  }
  return `<article class="card" style="--c:${p.color}">
      <header><b>${p.label}</b><span>${meta}</span></header>
      <div class="body">${body}</div></article>`;
}

function render() {
  if (!rounds.length) {
    $("rounds").innerHTML = `<p class="empty">Answers will appear here.</p>`;
    return updateButtons();
  }
  let html = `<div class="round"><h2>Question</h2><div class="card" style="--c:var(--line)"><div class="body">${md(question)}</div></div></div>`;
  rounds.forEach((round, i) => {
    html += `<div class="round"><h2>${round.title} <small>${round.note}</small></h2><div class="cols">` +
      Object.entries(round.results).map(([k, r]) => cardHtml(k, r, i > 0)).join("") + `</div></div>`;
  });
  if (finalResult) {
    html += `<div class="round"><h2>Final answer <small>written by ${byKey[finalResult.key].label}</small></h2>` +
      cardHtml(finalResult.key, finalResult, false) + `</div>`;
  }
  // Keep open "Review" sections open across re-renders.
  const open = [...document.querySelectorAll("details.review")].map(d => d.open);
  $("rounds").innerHTML = html;
  document.querySelectorAll("details.review").forEach((d, i) => { if (open[i]) d.open = true; });
  updateButtons();
}

buildModelPickers();
checkStatus();
render();
</script>
</body>
</html>
